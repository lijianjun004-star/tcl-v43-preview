name: TCL R2.1 Real Whisper Runtime Smoke (No Release)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release-ci/r21_real_model_probe.py'
      - '.github/workflows/r21-real-model-smoke.yml'
permissions:
  contents: read
concurrency:
  group: r21-real-whisper-runtime-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install browser test dependency (no OpenAI API or credentials)
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test REAL Whisper model load and synthetic-audio inference on the public R2.1 site
        run: python release-ci/r21_real_model_probe.py
      - name: Upload read-only model-loading diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r21-real-whisper-runtime-diagnostic
          path: r21_real_whisper_runtime_result.json
          if-no-files-found: warn
          retention-days: 7
