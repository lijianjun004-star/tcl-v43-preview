name: Deploy isolated R6.1 preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify audited static bundle
        run: echo "e5ed5c5a8b4ab5c4b090fdd89f2a05e872422059c2e05d87d1a2f55b76f79929  site.zip" | sha256sum --check --strict
      - name: Extract frontend only
        run: unzip -q site.zip -d _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy independent test site
        id: deployment
        uses: actions/deploy-pages@v4
