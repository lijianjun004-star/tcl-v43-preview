name: Deploy isolated R7 FIX02 preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify audited static bundle
        run: echo "099a57016c1ae24eab6b30cecfdc9ddaf3160571c6c500853f81bf5a654b924e  site.zip" | sha256sum --check --strict
      - name: Extract frontend only
        run: unzip -q site.zip -d _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy independent test site
        id: deployment
        uses: actions/deploy-pages@v4
