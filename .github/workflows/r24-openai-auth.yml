name: R24 OpenAI API authentication
on:
  push:
    branches: [verify/r24-openai-key]
    paths: [.github/workflows/r24-openai-auth.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify project key with the OpenAI models endpoint
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.OPENAI_API_KEY;
          if (!key) throw new Error('OPENAI_API_KEY is unavailable to this job.');
          const response = await fetch('https://api.openai.com/v1/models', {
            headers: {Authorization: `Bearer ${key}`},
            redirect: 'error',
            signal: AbortSignal.timeout(15000),
          }).catch(() => { throw new Error('Could not reach the OpenAI models endpoint.'); });
          if (!response.ok) throw new Error(`OpenAI models endpoint returned HTTP ${response.status}.`);
          const result = await response.json();
          if (result?.object !== 'list' || !Array.isArray(result.data)) throw new Error('Unexpected models response.');
          console.log(`OpenAI models endpoint returned HTTP ${response.status} and a valid model list.`);
          NODE
