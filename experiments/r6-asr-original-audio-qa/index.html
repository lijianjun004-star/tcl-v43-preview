<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><title>TCL R6 逐题录音转写｜隔离研究测试</title><style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#152336}.layout{max-width:620px;margin:0 auto;padding:22px 16px 60px}.hero{padding:20px;border-radius:20px;color:white;background:#182c48}h1{font-size:22px;margin:0 0 10px}p{line-height:1.6}main{display:grid;gap:12px;margin-top:14px}.card{padding:18px;background:white;border-radius:16px;box-shadow:0 3px 20px #1327440e}label{display:block;font-weight:600;margin:0 0 8px}input,select,textarea,button{font:inherit;width:100%;border-radius:12px;padding:12px;border:1px solid #ccd8e7}textarea{resize:vertical;min-height:110px}button{background:#154b9b;color:white;border:0;font-weight:700;margin-top:10px;min-height:46px}button:disabled{background:#8996a6}.secondary{background:#eaf1fb;color:#123d7b}.muted{color:#5c6d83;font-size:13px}.notice{background:#fff1d0;color:#674500;padding:12px;border-radius:10px}.status{white-space:pre-wrap;min-height:40px}.stack{display:grid;gap:8px}.green{color:#08755f}
</style></head><body><div class="layout"><header class="hero"><h1>逐题原始录音 → 文字</h1><div>R6 独立实验页面 · 不改线上 R6 · 不接 ChatGPT 账户</div></header><main>
<section class="card"><div class="notice"><b>实验提醒：</b>这不是已验收的识别产品。只有点击「本机 Whisper 识别」才会尝试加载模型；音频推理在浏览器内执行，但模型/JS 首次从第三方下载。首次下载和手机兼容性尚未验证；请勿上传保密录音。</div></section>
<section class="card stack"><label for="qid">当前弹幕题目</label><select id="qid"><option value="q1">第 1 题｜电视型号及功能</option><option value="q2">第 2 题｜冰箱保鲜功能</option><option value="q3">第 3 题｜空调能效参数</option></select><label for="audio">选择这道题已经录好的音频（WAV/M4A/MP3/WebM，取决于浏览器解码支持）</label><input type="file" accept="audio/*,.webm" id="audio"/><div class="muted" id="info">尚未选择录音</div><button id="go">本机 Whisper 识别本题录音</button><button id="sim" class="secondary">模拟数据流测试（不会识别声音）</button><div id="status" class="status muted" role="status" aria-live="polite">等待操作</div></section>
<section class="card stack"><label for="answer">本题回答文字（可人工修正）</label><textarea id="answer" placeholder="只有模型返回真实文字才自动写入"></textarea><button class="secondary" id="copy">复制当前题文字</button><div class="muted">切题期间，上一题延迟返回不会写入当前题；人工修改优先。每个题目保持独立文本。</div></section>
</main></div><script type="module">
/** Isolated ASR orchestration. Does not depend on or modify TCL R6. */
class QuestionASR {
  constructor({ transcribe, onUpdate = () => {}, timeoutMs = 120_000, maxBytes = 48 * 1024 * 1024 } = {}) {
    if (typeof transcribe !== 'function') throw new TypeError('transcribe must be a function');
    this.transcribe = transcribe;
    this.onUpdate = onUpdate;
    this.timeoutMs = timeoutMs;
    this.maxBytes = maxBytes;
    this.activeSession = null;
    this.activeQuestion = null;
    this.records = new Map();
    this.generation = 0;
    this.currentAbort = null;
  }
  static key(sessionId, questionId) { return JSON.stringify([String(sessionId), String(questionId)]); }
  current() { return this.records.get(QuestionASR.key(this.activeSession, this.activeQuestion)); }
  emit(record) { this.onUpdate({ ...record, blob: undefined }); }
  select(sessionId, questionId) {
    if (!String(sessionId || '').trim() || !String(questionId || '').trim()) throw new Error('sessionId/questionId required');
    this.cancel();
    this.activeSession = String(sessionId);
    this.activeQuestion = String(questionId);
    const key = QuestionASR.key(sessionId, questionId);
    if (!this.records.has(key)) this.records.set(key, { sessionId: String(sessionId), questionId: String(questionId), text: '', status: 'empty', manualRevision: 0 });
    this.emit(this.records.get(key));
  }
  cancel() {
    this.generation++;
    this.currentAbort?.abort();
    this.currentAbort = null;
  }
  manual(text) {
    const record = this.current();
    if (!record) throw new Error('no selected question');
    record.text = String(text ?? '');
    record.manualRevision++;
    record.status = 'manually_edited';
    this.emit(record);
  }
  async transcribeFile(blob) {
    const record = this.current();
    if (!record) throw new Error('no selected question');
    if (!blob || typeof blob.arrayBuffer !== 'function' || !Number.isFinite(blob.size) || blob.size === 0 || blob.size > this.maxBytes) {
      record.status = 'invalid_audio'; this.emit(record); return { status: 'invalid_audio' };
    }
    this.cancel();
    const owner = this.generation;
    const key = QuestionASR.key(record.sessionId, record.questionId);
    const manualRevision = record.manualRevision;
    record.blob = blob;
    record.status = 'transcribing'; this.emit(record);
    const aborter = new AbortController();
    this.currentAbort = aborter;
    let timer;
    try {
      const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('ASR_TIMEOUT')), this.timeoutMs); });
      const cancelled = new Promise((_, reject) => { aborter.signal.addEventListener('abort', () => reject(new Error('CANCELLED')), { once: true }); });
      const result = await Promise.race([Promise.resolve().then(() => this.transcribe(blob, { signal: aborter.signal, sessionId: record.sessionId, questionId: record.questionId })), timeout, cancelled]);
      if (this.generation !== owner || QuestionASR.key(this.activeSession, this.activeQuestion) !== key) return { status: 'stale_ignored' };
      if (record.manualRevision !== manualRevision) return { status: 'manual_preserved' };
      const text = typeof result === 'string' ? result.trim() : typeof result?.text === 'string' ? result.text.trim() : '';
      if (!text) { record.status = 'needs_retry'; this.emit(record); return { status: record.status }; }
      record.text = text;
      record.status = 'transcribed'; this.emit(record);
      return { status: record.status, text };
    } catch (err) {
      if (this.generation !== owner || QuestionASR.key(this.activeSession, this.activeQuestion) !== key) return { status: 'stale_ignored' };
      if (record.manualRevision !== manualRevision) return { status: 'manual_preserved' };
      record.status = err?.message === 'ASR_TIMEOUT' ? 'timeout' : 'needs_retry';
      record.error = String(err?.message || err || 'unknown').slice(0, 160);
      this.emit(record);
      return { status: record.status, error: record.error };
    } finally {
      clearTimeout(timer);
      if (this.generation === owner) this.currentAbort = null;
    }
  }
}

/** Candidate only: audio file -> decode/downmix/resample -> local Whisper.  */
const MODEL_ID = 'onnx-community/whisper-tiny'; // multilingual; NOT .en
const CDN = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';

async function prepareAudio(blob, { maxSeconds = 120 } = {}) {
  const Context = globalThis.AudioContext || globalThis.webkitAudioContext;
  if (!Context) throw new Error('AudioContext unavailable');
  if (blob.size > 48 * 1024 * 1024) throw new Error('audio exceeds 48 MiB');
  const ctx = new Context();
  try {
    const pcm = await ctx.decodeAudioData(await blob.arrayBuffer());
    if (!Number.isFinite(pcm.duration) || pcm.duration <= 0 || pcm.duration > maxSeconds) throw new Error('invalid or overlong audio');
    const mono = new Float32Array(pcm.length);
    for (let c = 0; c < pcm.numberOfChannels; c++) {
      const channel = pcm.getChannelData(c);
      for (let i = 0; i < mono.length; i++) mono[i] += channel[i] / pcm.numberOfChannels;
    }
    // OfflineAudioContext performs browser-native resampling to 16 kHz.
    const sampleCount = Math.max(1, Math.ceil(mono.length * 16000 / pcm.sampleRate));
    const offline = new OfflineAudioContext(1, sampleCount, 16000);
    const buf = offline.createBuffer(1, mono.length, pcm.sampleRate);
    buf.copyToChannel(mono, 0);
    const source = offline.createBufferSource();
    source.buffer = buf;
    source.connect(offline.destination);
    source.start();
    const rendered = await offline.startRendering();
    const data = rendered.getChannelData(0);
    let sumSq = 0;
    for (const x of data) sumSq += x * x;
    const rms = Math.sqrt(sumSq / data.length);
    return { data: new Float32Array(data), sampleRate: 16000, duration: pcm.duration, rms };
  } finally { await ctx.close().catch(() => {}); }
}

function createLocalWhisper({ onProgress = () => {} } = {}) {
  let cachedPipe;
  return async (blob, { signal } = {}) => {
    if (signal?.aborted) throw new Error('cancelled');
    onProgress('解码并提取本题录音');
    const audio = await prepareAudio(blob);
    if (signal?.aborted) throw new Error('cancelled');
    if (audio.rms < 0.001) return { text: '' }; // do not invent speech
    onProgress('加载多语言 Whisper 模型（首次需下载；网络/内存可能失败）');
    // External library and model files are not bundled, pinned model hash NOT verified.
    // This is an isolated research adapter, not a production-approved supply chain.
    if (!cachedPipe) {
      const { pipeline } = await import(CDN);
      cachedPipe = await pipeline('automatic-speech-recognition', MODEL_ID, { device: 'wasm', dtype: 'q8' });
    }
    if (signal?.aborted) throw new Error('cancelled');
    onProgress('在当前浏览器执行中文语音识别');
    const result = await cachedPipe(audio.data, { language: 'chinese', task: 'transcribe' });
    if (signal?.aborted) throw new Error('cancelled');
    return { text: result?.text || '' };
  };
}

const $=id=>document.getElementById(id);const sessionId='isolated-prototype-'+Date.now();const cache=new Map();let mock=false;let selectedFile=null;let programmatic=false;
const realEngine=createLocalWhisper({onProgress:s=>{$('status').textContent=s;}});
const manager=new QuestionASR({transcribe:async(blob,ctx)=>mock?{text:`[模拟数据，不是真实转写] 第 ${ctx.questionId.slice(1)} 题测试记录`}:realEngine(blob,ctx),onUpdate:s=>{
if(s.questionId!==$('qid').value)return; $('status').textContent=`状态：${s.status}${s.error?'｜'+s.error:''}`;if($('answer').value!==s.text){programmatic=true;$('answer').value=s.text;programmatic=false;} }});
manager.select(sessionId,'q1');
$('qid').addEventListener('change',()=>{manager.select(sessionId,$('qid').value); selectedFile=null;$('audio').value='';$('info').textContent='尚未选择录音';});
$('audio').addEventListener('change',()=>{selectedFile=$('audio').files[0]||null;$('info').textContent=selectedFile?`${selectedFile.name} · ${(selectedFile.size/1024).toFixed(1)} KiB`:'尚未选择录音';});
$('answer').addEventListener('input',()=>{if(!programmatic)manager.manual($('answer').value);});
$('go').addEventListener('click',async()=>{mock=false;await manager.transcribeFile(selectedFile);});
$('sim').addEventListener('click',async()=>{mock=true;await manager.transcribeFile(selectedFile||new Blob(['not real speech'],{type:'audio/webm'}));});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('answer').value);$('status').textContent='已复制';}catch(e){$('status').textContent='复制失败，请手动选择文字';}});
</script></body></html>
